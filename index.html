<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PokeBazar, um protótipo mobile-first para troca lúdica de brinquedos e cartas."
    />
    <title>PokeBazar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#FF5A5F",
              "primary-shadow": "#E03E43",
              accent: "#00D09C",
              "accent-shadow": "#00A67C",
              highlight: "#FFD166",
              canvas: "#F7F9FC",
              surface: "#FFFFFF",
              ink: "#2D3142",
              muted: "#9094A6"
            },
            fontFamily: {
              display: ["Fredoka", "Nunito", "sans-serif"],
              sans: ["Nunito", "ui-sans-serif", "system-ui", "sans-serif"]
            },
            boxShadow: {
              soft: "0 10px 30px rgba(45, 49, 66, 0.08)",
              lift: "0 16px 32px rgba(45, 49, 66, 0.12)",
              mint: "0 0 0 4px rgba(0, 208, 156, 0.2), 0 14px 30px rgba(0, 208, 156, 0.18)"
            }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app" class="app-frame" aria-live="polite"></div>
    <noscript>O PokeBazar precisa de JavaScript para brincar de trocar.</noscript>
    <script src="./src/app.js" defer></script>
  </body>
</html>
